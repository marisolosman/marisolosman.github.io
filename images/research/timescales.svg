<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Timescales covered by my research themes</title>
  <rect width="900" height="250" fill="#fff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <line x1="40" y1="200" x2="870" y2="200" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <g fill="#333" text-anchor="middle">
    <text x="110" y="225">days</text><text x="260" y="225">weeks</text><text x="420" y="225">seasons</text><text x="580" y="225">years</text><text x="740" y="225">decades</text>
  </g>
  <g stroke="#555"><line x1="110" y1="195" x2="110" y2="205"/><line x1="260" y1="195" x2="260" y2="205"/><line x1="420" y1="195" x2="420" y2="205"/><line x1="580" y1="195" x2="580" y2="205"/><line x1="740" y1="195" x2="740" y2="205"/></g>
  <text x="870" y="245" text-anchor="end" fill="#777" font-size="12">forecast lead time / timescale</text>
  <g font-size="13" fill="#fff">
    <rect x="130" y="20" width="310" height="30" rx="6" fill="#3b7dbf"/><text x="285" y="40" text-anchor="middle">Subseasonal prediction, weather regimes</text>
    <rect x="200" y="60" width="300" height="30" rx="6" fill="#7a5fb3"/><text x="350" y="80" text-anchor="middle">Stratosphere-troposphere coupling</text>
    <rect x="340" y="100" width="200" height="30" rx="6" fill="#2f9e8f"/><text x="440" y="120" text-anchor="middle">Seasonal prediction</text>
    <rect x="380" y="140" width="280" height="30" rx="6" fill="#d9822b"/><text x="520" y="160" text-anchor="middle">ENSO and other combined drivers</text>
    <rect x="630" y="100" width="240" height="30" rx="6" fill="#c0504d"/><text x="750" y="120" text-anchor="middle">Circulation change, storylines</text>
  </g>
  <rect x="180" y="0" width="680" height="14" rx="4" fill="#9aa5b1"/><text x="520" y="11" text-anchor="middle" font-size="11" fill="#fff">Climate services and applications draw on every timescale</text>
</svg>
